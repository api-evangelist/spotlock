name: Spotlock
description: >-
  Spotlock is a commodity risk management platform that helps organizations
  monitor, manage, and mitigate exposure to raw-material price volatility. It
  lets businesses track material exposures across inventory, customer contracts,
  and supplier commitments, set company-wide risk policies, and execute
  optimized hedging strategies — enabling fixed-price long-term contracts, profit
  margin protection, hedge accounting treatment, framework/agreement pricing, and
  global price intelligence for sectors such as construction and infrastructure,
  metal service centers and distribution, manufacturing and fabrication,
  automotive, energy, and transportation.
